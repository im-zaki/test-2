<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color</title>
    <style>
        div {
           height: 100p;
           width: 100px;
           border: 1px solid; 
        }

        .box-1 {
            background-color: red;
        }

        .box-2 {
            background-color: black;
            color: blue;
        }
        .box-3{
            background-color: blanchedalmond;
            color: brown;
        }
        .box-4{
            background-color: yellowgreen;
            color: aqua;
        }

    </style>
</head>
<body>
    
<div class="div">

    <h1>css color</h1>
    <div class="box-1">Div 1</div>
    <div class="box-2">Div 2</div>
    <div class="box-3">Div 3</div>
    <div class="box-4">Div 4</div>
    </div>

</body>
</html>
