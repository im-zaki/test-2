<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css.selector</title>
</head>
<body>
    <h1>lesson one</h1>
    <p>casharka 1</p>
    <style>
        /* Element name selector */
        body{
            background-color: whitesmoke;
        }
    h1{
        color: blueviolet;
    }
    /* class sector */
    .paragraph-1{
        font-size: larger;
        font-weight: bolder ;
        background: red;
    }
     /* ID selector */
     #para-2{
        color: orchid ;
        font-weight: bold;
        font-size: 20px;
     }
    </style>
    <h1>css selector</h1>
    <p class="paragraph-1">this is the paragraph stsyed using</p>
    <p id="para-2">this is the paragraph stsyed using</p>
    <input type="text" placeholder="name">
    <input type="password" placeholder="password">


</body>
</html>
